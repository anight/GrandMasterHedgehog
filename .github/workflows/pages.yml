name: Deploy game to Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; never cancel a run that is mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages must already be switched on with Source = GitHub Actions
      # (Settings -> Pages). The Actions token cannot create the site itself:
      # that needs admin rights, which GITHUB_TOKEN never has.
      - uses: actions/configure-pages@v5

      # web/ is already a complete static site: index.html + buggy.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
